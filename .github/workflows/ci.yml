name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROJECT: MacRemote/MacRemote.xcodeproj
      SCHEME: MacRemote
      DERIVED_DATA: build/DerivedData
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E 'error:|warning:|BUILD ' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E 'error:|failed|Test Suite|Executed|TEST ' || true
          grep -q 'TEST SUCCEEDED' test.log

      - name: Launch smoke test
        # Start the built app and make sure it is still running ten seconds
        # later. Catches crashes at launch that unit tests cannot see.
        run: |
          APP="$DERIVED_DATA/Build/Products/Debug/MacRemote.app"
          test -x "$APP/Contents/MacOS/MacRemote"
          "$APP/Contents/MacOS/MacRemote" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is still running after 10s — OK"
            kill "$PID"
          else
            echo "::error::App exited within 10s of launch"
            cat smoke.log
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
            smoke.log
          if-no-files-found: ignore
